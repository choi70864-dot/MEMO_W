<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>워크보드</title>
<style>
  :root{
    --paper: #FAF9F6;
    --panel: #FFFFFF;
    --ink: #2B2620;
    --ink-soft: #6F6A62;
    --line: #E7E2D9;
    --sage: #7E9686;
    --sage-bg: #EAF0EA;
    --clay: #C4785C;
    --clay-bg: #F6E8E2;
    --sand: #C9A24B;
    --sand-bg: #F5EDD9;
    --slate: #6C7E93;
    --slate-bg: #E9EEF3;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:960px;
    margin:0 auto;
    padding:18px 18px 24px;
  }
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    padding:0 2px;
    position:relative;
  }
  .top h1{
    font-size:17px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.2px;
    outline:none;
    border-radius:4px;
    padding:1px 3px;
    margin-left:-3px;
  }
  .top h1:hover{ background:var(--paper); }
  .top h1:focus{ outline:1.5px solid var(--slate); background:var(--panel); }
  .top-right{
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
  }
  .top .date{
    font-size:12px;
    color:var(--ink-soft);
  }
  .add-major-btn{
    font-size:12px;
    font-weight:600;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    border-radius:8px;
    padding:5px 10px;
    cursor:pointer;
  }
  .add-major-btn:hover{ background:var(--paper); }
  .add-menu{
    position:absolute;
    top:30px;
    right:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,0.09);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    z-index:20;
    min-width:150px;
  }
  .add-menu.hidden{ display:none; }
  .add-menu button{
    border:none;
    background:none;
    text-align:left;
    font-size:12.5px;
    padding:9px 12px;
    cursor:pointer;
    color:var(--ink);
  }
  .add-menu button:hover{ background:var(--paper); }
  .board-wrap{
    display:flex;
    align-items:flex-start;
    gap:14px;
  }
  .board-wrap > #project-panel{
    width:250px;
    flex:0 0 250px;
  }
  .memo-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap:14px;
    flex:1;
    min-width:0;
  }
  @media (max-width: 720px){
    .board-wrap{ flex-direction:column; }
    .board-wrap > #project-panel{ width:100%; flex:none; }
  }
  .item-date{
    font-size:10px;
    color:var(--ink-soft);
    white-space:nowrap;
    opacity:0.85;
  }
  .card-date{
    margin-top:5px;
    text-align:right;
  }
  .col{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    max-height:560px;
    display:flex;
    flex-direction:column;
  }
  .col-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .col-title{
    font-size:13px;
    font-weight:700;
  }
  .col-count{
    font-size:11px;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:1px 7px;
  }
  .scroll{
    overflow-y:auto;
    padding-right:2px;
    flex:1;
  }
  .scroll::-webkit-scrollbar{ width:6px; }
  .scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }

  /* --- 프로젝트 보드 (좌측) --- */
  .project{
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .project-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 9px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .project-name{
    font-size:12.5px;
    font-weight:600;
    outline:none;
    flex:1;
  }
  .task-list{ padding:6px 8px 8px; }
  .task{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:6px 2px;
    font-size:12.5px;
    border-bottom:1px dashed var(--line);
  }
  .task:last-child{ border-bottom:none; }
  .task-top{
    display:flex;
    align-items:flex-start;
    gap:6px;
  }
  .task-text{
    flex:1;
    outline:none;
    word-break:break-word;
  }
  .task-text.done{
    color:var(--ink-soft);
    text-decoration:line-through;
  }
  .task-meta{
    display:flex;
    align-items:center;
    gap:5px;
    flex-wrap:wrap;
    padding-left:1px;
  }
  .due-label{ opacity:0.7; }
  .due-input{
    font-size:10px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 3px;
    background:var(--panel);
    font-family:inherit;
    max-width:100px;
  }
  .status{
    font-size:10.5px;
    font-weight:600;
    padding:2px 7px;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
    border:1px solid transparent;
    margin-left:auto;
  }
  .status[data-s="todo"]{ background:var(--slate-bg); color:var(--slate); }
  .status[data-s="doing"]{ background:var(--sand-bg); color:#9C7A1F; }
  .status[data-s="done"]{ background:var(--sage-bg); color:#4F6A57; }
  .del-btn{
    opacity:0;
    border:none;
    background:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;
    line-height:1;
    padding:0 2px;
  }
  .task:hover .del-btn, .project-head:hover .del-btn, .memo-card:hover .del-btn{ opacity:1; }
  .add-task{
    display:flex;
    gap:6px;
    padding:5px 8px 8px;
  }
  .add-task input{
    flex:1;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:12px;
    padding:4px 7px;
    font-family:inherit;
  }
  .add-task input:focus{ outline:1.5px solid var(--slate); }
  .add-icon-btn{
    flex:0 0 auto;
    width:26px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    border-radius:6px;
    font-size:14px;
    line-height:1;
    cursor:pointer;
  }
  .add-icon-btn:hover{ background:var(--paper); }
  .ghost-btn{
    border:1px dashed var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-size:12px;
    border-radius:8px;
    padding:7px;
    cursor:pointer;
    width:100%;
    margin-top:2px;
  }
  .ghost-btn:hover{ background:var(--paper); color:var(--ink); }

  /* --- 메모 보드 (중앙/우측) --- */
  .memo-col{ position:relative; }
  .memo-col .col-head{ cursor:default; }
  .board-name{ outline:none; }
  .memo-card{
    border-radius:8px;
    padding:9px 10px;
    margin-bottom:8px;
    font-size:12.5px;
    line-height:1.5;
    position:relative;
    border:1px solid transparent;
  }
  .memo-card .memo-text{
    outline:none;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .memo-card .del-btn{ position:absolute; top:5px; right:6px; }
  .memo-add{
    border:1px dashed var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-size:12px;
    border-radius:8px;
    padding:7px;
    cursor:pointer;
    width:100%;
  }
  .memo-add:hover{ background:var(--paper); color:var(--ink); }
  .color-dot{
    width:8px;height:8px;border-radius:50%;
    display:inline-block;margin-right:5px;
  }
  .col-menu{
    border:none;background:none;color:var(--ink-soft);
    cursor:pointer;font-size:14px;padding:0 3px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="top">
    <h1 id="app-title" contenteditable="true" spellcheck="false">워크보드</h1>
    <div class="top-right">
      <div class="date" id="today"></div>
      <button id="add-major-btn" class="add-major-btn">+ 추가</button>
      <div id="add-menu" class="add-menu hidden">
        <button data-type="project">+ 새 프로젝트</button>
        <button data-type="board">+ 새 메모 보드</button>
      </div>
    </div>
  </div>
  <div class="board-wrap">
    <div id="project-panel"></div>
    <div class="memo-grid" id="memo-panels"></div>
  </div>
</div>

<script>
/* ---------------- 데이터 ----------------
  브라우저의 localStorage에 자동 저장됩니다.
  같은 파일을 같은 브라우저에서 다시 열면 이전 내용이 그대로 불러와집니다.
  (단, Claude 채팅 안의 미리보기 화면에서는 보안상 저장이 안 될 수 있어요.
   내 컴퓨터에서 직접 파일을 열었을 때 정상적으로 저장됩니다.)
------------------------------------------ */

let uid = 1;
const nextId = () => uid++;
const STORAGE_KEY = "workboard-state-v1";

function createDefaultState(){
  const now = new Date().toISOString();
  return {
    title: "워크보드",
    projects: [
      { id: nextId(), name: "웹사이트 리뉴얼", tasks: [
        { id: nextId(), text: "요구사항 정리", status: "done", createdAt: now },
        { id: nextId(), text: "메인 화면 시안", status: "doing", createdAt: now },
        { id: nextId(), text: "반응형 QA", status: "todo", createdAt: now },
      ]},
      { id: nextId(), name: "9월 보고서", tasks: [
        { id: nextId(), text: "데이터 취합", status: "doing", createdAt: now },
        { id: nextId(), text: "초안 작성", status: "todo", createdAt: now },
      ]},
    ],
    boards: [
      { id: nextId(), name: "아이디어", color: "sage", fixed: true, cards: [
        { id: nextId(), text: "메모 카드를 눌러서 바로 수정할 수 있어요.", createdAt: now },
        { id: nextId(), text: "새로운 아이디어가 떠오르면 여기에 적어두기.", createdAt: now },
      ]},
      { id: nextId(), name: "기록", color: "clay", fixed: true, cards: [
        { id: nextId(), text: "오늘 회의에서 나온 이야기 정리.", createdAt: now },
      ]},
    ]
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    let maxId = 0;
    const scan = (obj) => { if(obj && typeof obj.id === "number") maxId = Math.max(maxId, obj.id); };
    (parsed.projects || []).forEach(p => { scan(p); (p.tasks || []).forEach(scan); });
    (parsed.boards || []).forEach(b => { scan(b); (b.cards || []).forEach(scan); });
    uid = maxId + 1;
    return parsed;
  }catch(e){
    console.error("워크보드 불러오기 실패:", e);
    return null;
  }
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error("워크보드 저장 실패:", e);
  }
}

let state = loadState() || createDefaultState();

const statusOrder = ["todo","doing","done"];
const statusLabel = { todo:"시작 전", doing:"진행 중", done:"완료" };
const boardColors = {
  sage:  { bg:"var(--sage-bg)",  dot:"var(--sage)" },
  clay:  { bg:"var(--clay-bg)",  dot:"var(--clay)" },
  sand:  { bg:"var(--sand-bg)",  dot:"var(--sand)" },
  slate: { bg:"var(--slate-bg)", dot:"var(--slate)" },
};
const colorCycle = ["sage","clay","sand","slate"];

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString("ko-KR", { month:"long", day:"numeric", weekday:"short" });
}
document.getElementById("today").textContent = todayStr();

const titleEl = document.getElementById("app-title");
titleEl.textContent = state.title || "워크보드";
titleEl.addEventListener("blur", () => {
  state.title = titleEl.textContent.trim() || "워크보드";
  titleEl.textContent = state.title;
  save();
});
titleEl.addEventListener("keydown", e => {
  if(e.key === "Enter"){ e.preventDefault(); titleEl.blur(); }
});

function formatDate(iso){
  const d = iso ? new Date(iso) : new Date();
  return `${d.getMonth() + 1}.${d.getDate()}`;
}

function render(){
  const projectPanel = document.getElementById("project-panel");
  const memoPanels = document.getElementById("memo-panels");
  projectPanel.innerHTML = "";
  memoPanels.innerHTML = "";
  projectPanel.appendChild(renderProjectColumn());
  state.boards.forEach((b, idx) => memoPanels.appendChild(renderMemoColumn(b, idx)));
}

/* ---------- 상단: 대항목(프로젝트/메모 보드) 추가 ---------- */
const addMajorBtn = document.getElementById("add-major-btn");
const addMenu = document.getElementById("add-menu");
addMajorBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  addMenu.classList.toggle("hidden");
});
addMenu.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => addMenu.classList.add("hidden"));
addMenu.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("click", () => {
    addMenu.classList.add("hidden");
    if(btn.dataset.type === "project"){
      const name = prompt("새 프로젝트 이름을 입력하세요", "새 프로젝트");
      if(name && name.trim()){
        state.projects.push({ id: nextId(), name: name.trim(), tasks: [] });
        save(); render();
      }
    } else {
      const name = prompt("새 메모 보드 이름을 입력하세요", "새 메모");
      if(name && name.trim()){
        const color = colorCycle[state.boards.length % colorCycle.length];
        state.boards.push({ id: nextId(), name: name.trim(), color, fixed: false, cards: [] });
        save(); render();
      }
    }
  });
});

/* ---------- 좌측: 프로젝트 현황판 ---------- */
function renderProjectColumn(){
  const col = document.createElement("div");
  col.className = "col";
  col.innerHTML = `
    <div class="col-head">
      <span class="col-title">프로젝트</span>
      <span class="col-count">${state.projects.length}</span>
    </div>
    <div class="scroll" id="project-scroll"></div>
    <button class="ghost-btn" id="add-project">+ 프로젝트 추가</button>
  `;
  const scroll = col.querySelector("#project-scroll");

  state.projects.forEach(project => {
    const pEl = document.createElement("div");
    pEl.className = "project";

    const head = document.createElement("div");
    head.className = "project-head";
    const nameEl = document.createElement("div");
    nameEl.className = "project-name";
    nameEl.contentEditable = "true";
    nameEl.textContent = project.name;
    nameEl.addEventListener("blur", () => { project.name = nameEl.textContent.trim() || "제목 없음"; save(); });
    nameEl.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); nameEl.blur(); }});
    const delP = document.createElement("button");
    delP.className = "del-btn"; delP.textContent = "✕";
    delP.title = "프로젝트 삭제";
    delP.addEventListener("click", () => {
      state.projects = state.projects.filter(p => p.id !== project.id);
      save(); render();
    });
    head.appendChild(nameEl); head.appendChild(delP);
    pEl.appendChild(head);

    const list = document.createElement("div");
    list.className = "task-list";
    project.tasks.forEach(task => list.appendChild(renderTask(project, task)));
    pEl.appendChild(list);

    const addRow = document.createElement("div");
    addRow.className = "add-task";
    const input = document.createElement("input");
    input.placeholder = "할 일 추가";
    const commitTask = () => {
      if(input.value.trim()){
        project.tasks.push({ id: nextId(), text: input.value.trim(), status: "todo", createdAt: new Date().toISOString() });
        input.value = "";
        save(); render();
      }
    };
    input.addEventListener("keydown", e => {
      if(e.key === "Enter"){ e.preventDefault(); commitTask(); }
    });
    const addBtn = document.createElement("button");
    addBtn.className = "add-icon-btn";
    addBtn.textContent = "+";
    addBtn.title = "할 일 추가";
    addBtn.addEventListener("click", commitTask);
    addRow.appendChild(input);
    addRow.appendChild(addBtn);
    pEl.appendChild(addRow);

    scroll.appendChild(pEl);
  });

  col.querySelector("#add-project").addEventListener("click", () => {
    state.projects.push({ id: nextId(), name: "새 프로젝트", tasks: [] });
    save(); render();
  });

  return col;
}

function renderTask(project, task){
  const row = document.createElement("div");
  row.className = "task";

  const top = document.createElement("div");
  top.className = "task-top";

  const text = document.createElement("div");
  text.className = "task-text" + (task.status === "done" ? " done" : "");
  text.contentEditable = "true";
  text.textContent = task.text;
  text.addEventListener("blur", () => { task.text = text.textContent.trim() || "내용 없음"; save(); });
  text.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); text.blur(); }});

  const del = document.createElement("button");
  del.className = "del-btn"; del.textContent = "✕";
  del.addEventListener("click", () => {
    project.tasks = project.tasks.filter(t => t.id !== task.id);
    save(); render();
  });

  top.appendChild(text);
  top.appendChild(del);

  const meta = document.createElement("div");
  meta.className = "task-meta";

  const date = document.createElement("span");
  date.className = "item-date";
  date.title = "작성일";
  date.textContent = formatDate(task.createdAt);

  const dueLabel = document.createElement("span");
  dueLabel.className = "item-date due-label";
  dueLabel.textContent = "마감";

  const dueInput = document.createElement("input");
  dueInput.type = "date";
  dueInput.className = "due-input";
  if(task.dueDate) dueInput.value = task.dueDate;
  dueInput.addEventListener("change", () => {
    task.dueDate = dueInput.value || null;
    save();
  });

  const status = document.createElement("span");
  status.className = "status";
  status.dataset.s = task.status;
  status.textContent = statusLabel[task.status];
  status.title = "클릭해서 상태 변경";
  status.addEventListener("click", () => {
    const i = statusOrder.indexOf(task.status);
    task.status = statusOrder[(i + 1) % statusOrder.length];
    save(); render();
  });

  meta.appendChild(date);
  meta.appendChild(dueLabel);
  meta.appendChild(dueInput);
  meta.appendChild(status);

  row.appendChild(top);
  row.appendChild(meta);
  return row;
}

/* ---------- 중앙/우측: 메모 카드 보드 ---------- */
function renderMemoColumn(b, idx){
  const palette = boardColors[b.color] || boardColors.slate;
  const col = document.createElement("div");
  col.className = "col memo-col";

  const head = document.createElement("div");
  head.className = "col-head";
  head.innerHTML = `<span class="col-title"><span class="color-dot" style="background:${palette.dot}"></span></span>`;
  const titleWrap = head.querySelector(".col-title");
  const nameEl = document.createElement("span");
  nameEl.className = "board-name";
  nameEl.contentEditable = "true";
  nameEl.textContent = b.name;
  nameEl.addEventListener("blur", () => { b.name = nameEl.textContent.trim() || "메모"; save(); });
  nameEl.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); nameEl.blur(); }});
  titleWrap.appendChild(nameEl);

  const rightWrap = document.createElement("div");
  const cycleColor = document.createElement("button");
  cycleColor.className = "col-menu"; cycleColor.textContent = "●"; cycleColor.title = "색상 변경";
  cycleColor.style.color = palette.dot;
  cycleColor.addEventListener("click", () => {
    const ci = colorCycle.indexOf(b.color);
    b.color = colorCycle[(ci + 1) % colorCycle.length];
    save(); render();
  });
  rightWrap.appendChild(cycleColor);
  if(!b.fixed){
    const delBoard = document.createElement("button");
    delBoard.className = "col-menu"; delBoard.textContent = "✕"; delBoard.title = "보드 삭제";
    delBoard.addEventListener("click", () => {
      state.boards = state.boards.filter(x => x.id !== b.id);
      save(); render();
    });
    rightWrap.appendChild(delBoard);
  }
  head.appendChild(rightWrap);
  col.appendChild(head);

  const scroll = document.createElement("div");
  scroll.className = "scroll";
  b.cards.forEach(card => scroll.appendChild(renderCard(b, card, palette)));
  col.appendChild(scroll);

  const addBtn = document.createElement("button");
  addBtn.className = "memo-add";
  addBtn.textContent = "+ 카드 추가";
  addBtn.addEventListener("click", () => {
    b.cards.push({ id: nextId(), text: "", createdAt: new Date().toISOString() });
    save(); render();
    setTimeout(() => {
      const last = document.querySelectorAll(".memo-col")[idx].querySelectorAll(".memo-text");
      const el = last[last.length - 1];
      if(el){ el.focus(); }
    }, 0);
  });
  col.appendChild(addBtn);

  return col;
}

function renderCard(b, card, palette){
  const el = document.createElement("div");
  el.className = "memo-card";
  el.style.background = palette.bg;

  const text = document.createElement("div");
  text.className = "memo-text";
  text.contentEditable = "true";
  text.textContent = card.text;
  text.addEventListener("blur", () => { card.text = text.textContent; save(); });
  el.appendChild(text);

  const date = document.createElement("div");
  date.className = "item-date card-date";
  date.textContent = formatDate(card.createdAt);
  el.appendChild(date);

  const del = document.createElement("button");
  del.className = "del-btn"; del.textContent = "✕";
  del.addEventListener("click", () => {
    b.cards = b.cards.filter(c => c.id !== card.id);
    save(); render();
  });
  el.appendChild(del);
  return el;
}

render();
</script>
</body>
</html>
